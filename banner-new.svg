<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="12%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="88%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#777777"/>
      <animate attributeName="y1" values="0%;10%;0%;8%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;90%;100%;92%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;0%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#1a1a1a" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- black background -->
  <rect width="1200" height="320" fill="#000000"/>

  <!-- monochrome matrix rain -->
  <g fill="#cccccc" font-size="16" opacity="0.30">
    <text x="60"  y="0">10110 01011 11010 00101<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="6.0s" begin="0.0s" repeatCount="indefinite"/></text>
    <text x="150" y="0">0xFE3A 9C12 44AF 77B0<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="7.5s" begin="1.2s" repeatCount="indefinite"/></text>
    <text x="250" y="0">01001 11100 00011 10110<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="5.2s" begin="0.6s" repeatCount="indefinite"/></text>
    <text x="350" y="0">sudo access_granted()<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="8.0s" begin="2.1s" repeatCount="indefinite"/></text>
    <text x="470" y="0">11010 00110 10011 01100<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="6.6s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="560" y="0">0xDEAD 0xBEEF 0xCAFE 0xF00D<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="9.0s" begin="1.7s" repeatCount="indefinite"/></text>
    <text x="680" y="0">10111 01010 11101 00010<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="5.8s" begin="0.9s" repeatCount="indefinite"/></text>
    <text x="790" y="0">ssh root@zehedisode<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="7.2s" begin="2.4s" repeatCount="indefinite"/></text>
    <text x="900" y="0">01100 10011 00101 11010<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="6.3s" begin="0.2s" repeatCount="indefinite"/></text>
    <text x="1000" y="0">0xA1B2 C3D4 E5F6 7890<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="8.4s" begin="1.0s" repeatCount="indefinite"/></text>
    <text x="1100" y="0">11101 00010 10110 01001<animateTransform attributeName="transform" type="translate" values="0 -90; 0 360" dur="5.5s" begin="1.9s" repeatCount="indefinite"/></text>
  </g>

  <!-- fade to hide rain pop at edges -->
  <rect width="1200" height="320" fill="url(#fade)" pointer-events="none"/>

  <!-- CRT scanlines + moving scan beam -->
  <rect width="1200" height="320" fill="url(#scan)" pointer-events="none"/>
  <rect x="0" y="0" width="1200" height="3" fill="#ffffff" opacity="0.18">
    <animate attributeName="y" values="0;317;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal window -->
  <rect x="40" y="34" width="1120" height="116" rx="8" fill="#000000" stroke="#888888" stroke-width="1.2" opacity="0.92"/>
  <circle cx="66" cy="58" r="5" fill="#ff5f56"/>
  <circle cx="86" cy="58" r="5" fill="#ffbd2e"/>
  <circle cx="106" cy="58" r="5" fill="#27c93f"/>
  <text x="600" y="62" fill="#999999" font-size="12" text-anchor="middle">root@zehedisode — terminal</text>

  <text x="64" y="94" font-size="15" fill="#e6e6e6">root@zehedisode<tspan fill="#999999">:</tspan><tspan fill="#88aaff">~</tspan><tspan fill="#999999"># </tspan><tspan fill="#ffffff">scan --target github/zehedisode</tspan></text>
  <text x="64" y="116" font-size="14" fill="#bbbbbb" font-weight="bold">breaching the mainframe... just kidding ;)</text>

  <rect x="64" y="130" width="1072" height="12" rx="2" fill="#222222"/>
  <rect x="64" y="130" width="0" height="12" rx="2" fill="#dddddd">
    <animate attributeName="width" values="0;1072;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch title (monochrome) -->
  <g transform="translate(600,250)" text-anchor="middle" font-size="60" font-weight="bold">
    <text x="0" y="0" fill="#777777" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0; 4 -2; -3 1; 2 0; 0 0" dur="0.17s" repeatCount="indefinite"/>
      zehedisode
    </text>
    <text x="0" y="0" fill="#aaaaaa" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0; -4 2; 3 -1; -2 0; 0 0" dur="0.20s" repeatCount="indefinite"/>
      zehedisode
    </text>
    <text x="0" y="0" fill="url(#metal)">zehedisode</text>
    <rect x="-190" y="-50" width="380" height="70" fill="url(#shine)" opacity="0.4"/>
  </g>

  <!-- blinking cursor -->
  <text x="600" y="302" text-anchor="middle" font-size="18" fill="#e6e6e6">root@zehedisode:~# <tspan fill="#e6e6e6">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
