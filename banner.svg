<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="greenGlow" cx="0.15" cy="0.2" r="1.6" fx="0.15" fy="0.2">
      <stop offset="0%" stop-color="#0aff6a" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#0aff6a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animate attributeName="cx" values="0.15;0.4;0.7;0.4;0.15" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.2;0.6;0.8;0.4;0.2" dur="18s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.85" cy="0.8" r="1.4" fx="0.85" fy="0.8">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      <animate attributeName="cx" values="0.85;0.6;0.3;0.6;0.85" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0.8;0.4;0.2;0.5;0.8" dur="22s" repeatCount="indefinite"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#c8ffd6"/>
      <stop offset="50%" stop-color="#39ff8a"/>
      <stop offset="80%" stop-color="#1f9e57"/>
      <stop offset="100%" stop-color="#0a3d22"/>
      <animate attributeName="y1" values="0%;10%;0%;8%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;90%;100%;92%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;0%;100%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;100%;200%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#0a0e14"/>
  <rect width="1200" height="320" fill="url(#greenGlow)"/>
  <rect width="1200" height="320" fill="url(#cyanGlow)"/>

  <!-- terminal window -->
  <rect x="40" y="30" width="1120" height="120" rx="10" fill="#010409" stroke="#30363d" stroke-width="1.5" opacity="0.88"/>
  <circle cx="66" cy="56" r="6" fill="#ff5f56"/>
  <circle cx="88" cy="56" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="56" r="6" fill="#27c93f"/>
  <text x="600" y="60" fill="#8b949e" font-size="13" text-anchor="middle">zehedisode — zsh</text>

  <text x="64" y="92" font-size="16" fill="#39d353">zehedisode@github<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$ </tspan><tspan fill="#e6edf3">GET profile zehedisode --verbose</tspan></text>
  <text x="64" y="116" font-size="15" fill="#bd93f9" font-weight="bold">Loading zehedisode's profile...</text>

  <!-- animated progress bar -->
  <rect x="64" y="130" width="1072" height="14" rx="3" fill="#44475a"/>
  <rect x="64" y="130" width="0" height="14" rx="3" fill="#39ff8a">
    <animate attributeName="width" values="0;1072;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch title -->
  <g transform="translate(600,250)" text-anchor="middle" font-size="64" font-weight="bold">
    <text x="0" y="0" fill="#ff0040" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; 3 -2; -2 1; 1 0; 0 0" dur="0.18s" repeatCount="indefinite"/>
      zehedisode
    </text>
    <text x="0" y="0" fill="#00e5ff" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0 0; -3 2; 2 -1; -1 0; 0 0" dur="0.21s" repeatCount="indefinite"/>
      zehedisode
    </text>
    <text x="0" y="0" fill="url(#metal)">zehedisode</text>
    <rect x="-190" y="-52" width="380" height="72" fill="url(#shine)" opacity="0.5"/>
  </g>

  <!-- blinking cursor subtitle -->
  <text x="600" y="302" text-anchor="middle" font-size="20" fill="#39d353">AI &amp; LLM Developer<tspan fill="#39d353">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
